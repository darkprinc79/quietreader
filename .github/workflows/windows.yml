name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and bundle Quiet Reader
        shell: pwsh
        run: ./windows/build.ps1

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: quietreader-windows-x64
          path: windows/quietreader-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
